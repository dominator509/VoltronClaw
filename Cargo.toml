[package]
name = "voltron-claw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voltron Claw — Rust-native composite agent"

[dependencies]
voltron-core = { path = "crates/voltron-core" }
voltron-providers = { path = "crates/voltron-providers" }
voltron-memory = { path = "crates/voltron-memory" }
voltron-skills = { path = "crates/voltron-skills" }
voltron-channels = { path = "crates/voltron-channels" }
voltron-audit = { path = "crates/voltron-audit" }
voltron-runtime = { path = "crates/voltron-runtime" }
voltron-ironclaw-adapter = { path = "crates/voltron-ironclaw-adapter" }

clap.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

[workspace]
members = [
    "crates/voltron-core",
    "crates/voltron-providers",
    "crates/voltron-memory",
    "crates/voltron-skills",
    "crates/voltron-channels",
    "crates/voltron-audit",
    "crates/voltron-runtime",
    "crates/voltron-moltis-adapter",
    "crates/voltron-ironclaw-adapter",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dominator509/voltron-claw"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits and streams
async-trait = "0.1"

# Stream utilities
futures = "0.3"
tokio-stream = "0.1"

# SQLite memory backend
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# LLM provider abstraction
rig-core = "0.7"

# HTTP client for LLM providers
reqwest = { version = "0.12", features = ["json"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# TOML config parsing
toml = "0.8"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# OS keyring for API keys
keyring = "2"

# Cryptographic verification
ed25519-dalek = "2"

# CBOR deterministic serialization
ciborium = "0.2"

# Random number generation (ed25519 key gen)
rand = "0.8"

# Semantic versioning
semver = { version = "1", features = ["serde"] }

# Binary serialisation helpers
serde_bytes = "0.11"

[profile.release]
opt-level = 3
lto = true
